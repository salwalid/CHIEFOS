<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Schedule | Alpha HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="calendar-styles">
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: rgba(255, 255, 255, 0.1); }
        .calendar-cell { min-height: 120px; background-color: #0f172a; padding: 0.5rem; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); }
        .calendar-cell:hover { background-color: #1e293b; }
        .event-tag { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; margin-bottom: 3px; display: block; border-left: 3px solid transparent; line-height: 1.2; word-wrap: break-word; white-space: normal; }
        .tag-property { background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: #10b981; }
        .tag-medical { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: #ef4444; }
        .tag-finance { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border-color: #f59e0b; }
        .tag-admin { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: #38bdf8; }
        .tag-travel { background: rgba(168, 85, 247, 0.15); color: #a855f7; border-color: #a855f7; }
        .today { border: 2px solid #38bdf8 !important; background-color: rgba(56, 189, 248, 0.1); }
        .calendar-section { margin-bottom: 3rem; }
        .month-header { font-size: 1.5rem; font-weight: 800; color: #38bdf8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .side-nav { position: fixed; right: 2rem; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1rem; z-index: 100; }
        .side-btn { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; writing-mode: vertical-rl; text-orientation: mixed; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); }
        .side-btn:hover { background: rgba(56, 189, 248, 0.3); transform: scale(1.1); }
        .year-view-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 200; overflow-y: auto; padding: 4rem; }
        .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .mini-month { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 1rem; border-radius: 1rem; }
        .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 0.6rem; }
        .mini-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 2px; }
        .has-event { background: #38bdf8; color: #000; font-weight: bold; }
    </style>
</head>

<body class="min-h-screen p-6">
    <!-- Side Nav -->
    <div class="side-nav">
        <button onclick="toggleYearView()" class="side-btn">1-YEAR STRATEGIC VIEW</button>
    </div>

    <!-- Year View Modal -->
    <div id="yearView" class="year-view-modal">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-12">
                <h1 class="text-4xl font-black text-white uppercase">2026 Strategic Roadmap</h1>
                <button onclick="toggleYearView()" class="text-slate-400 hover:text-white">[ CLOSE ]</button>
            </div>
            <div class="year-grid" id="yearGrid"></div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center">
        <a href="/HQ/" class="text-sky-400 flex items-center hover:text-sky-300 transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back to Mission Control
        </a>
        <h1 class="text-2xl font-bold tracking-tight text-white">Operations Schedule</h1>
        <div class="text-slate-400 text-sm font-mono"><span id="syncTime">Loading...</span></div>
    </div>

    <div id="mainSchedule" class="max-w-7xl mx-auto space-y-16">
        <!-- Months will be injected here -->
    </div>

    
    
    
    
    <script id="calendar-logic">
        let events = [];
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function loadAndRender() {
            fetch('/HQ/schedule/schedule_data.json?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    events = data.events || [];
                    const syncEl = document.getElementById('syncTime');
                    if (syncEl) syncEl.innerText = 'Synced: ' + data.syncTime;
                    renderSchedule();
                })
                .catch(err => console.error('Schedule data fetch failed:', err));
        }

        function renderSchedule() {
            const main = document.getElementById('mainSchedule');
            main.innerHTML = '';
            const now = new Date();
            for (let m = now.getMonth(); m < 12; m++) {
                main.appendChild(buildMonth(now.getFullYear(), m));
            }
        }

        // Auto-refresh data every 60 seconds
        setInterval(loadAndRender, 60000);
        
        function toggleYearView() {
            const modal = document.getElementById('yearView');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            if (modal.style.display === 'block') buildYearGrid();
        }

        function buildYearGrid() {
            const grid = document.getElementById('yearGrid');
            grid.innerHTML = '';
            const year = 2026;
            
            for (let m = 0; m < 12; m++) {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'mini-month cursor-pointer hover:border-sky-500 transition-all transform hover:scale-105';
                monthDiv.setAttribute('onclick', `showSpecificMonth(${m})`);
                monthDiv.innerHTML = `<div class='text-xs font-bold mb-2 text-sky-400'>${monthNames[m]}</div>`;
                
                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                
                const daysInMonth = new Date(year, m + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'mini-day';
                    const dateStr = `${year}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                    const hasEvent = events.some(e => e.date === dateStr);
                    if (hasEvent) dayDiv.classList.add('has-event');
                    dayDiv.innerText = d;
                    miniGrid.appendChild(dayDiv);
                }
                monthDiv.appendChild(miniGrid);
                grid.appendChild(monthDiv);
            }
        }

        function showSpecificMonth(m) {
            const main = document.getElementById('mainSchedule');
            main.innerHTML = '';
            const year = 2026;
            
            // Add the selected month
            main.appendChild(buildMonth(year, m));
            
            // Add the next month for context
            if (m < 11) {
                main.appendChild(buildMonth(year, m + 1));
            }
            
            toggleYearView(); // Close modal
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function buildMonth(year, month) {
            const container = document.createElement('div');
            container.className = 'calendar-section';
            container.innerHTML = `<div class='month-header'>${monthNames[month]} ${year}</div>`;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'glass rounded-2xl overflow-hidden shadow-2xl';
            
            const header = document.createElement('div');
            header.className = 'grid grid-cols-7 text-center py-4 bg-slate-800/50 border-b border-white/10 text-xs font-bold uppercase tracking-widest text-slate-400';
            header.innerHTML = '<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>';
            wrapper.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid grid-cols-7';
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = 'repeat(7, 1fr)';
            grid.style.gap = '1px';
            grid.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const pad = document.createElement('div');
                pad.className = 'calendar-cell opacity-20';
                grid.appendChild(pad);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
                const cell = document.createElement('div');
                cell.className = `calendar-cell ${isToday ? 'today' : ''}`;
                
                cell.innerHTML = `<span class="text-sm font-mono ${isToday ? 'text-sky-400 font-bold' : 'text-slate-500'}">${d.toString().padStart(2, '0')}</span>`;
                
                const eventContainer = document.createElement('div');
                eventContainer.className = 'mt-2 space-y-1';
                
                const dateStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                
                dayEvents.forEach(e => {
                    const el = document.createElement('span');
                    el.className = `event-tag tag-${e.type || 'admin'}`;
                    el.innerText = e.title;
                    eventContainer.appendChild(el);
                });

                cell.appendChild(eventContainer);
                grid.appendChild(cell);
            }
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
            return container;
        }

        // Initial load
        loadAndRender();
    </script>
    
    
    
    
</body>
</html>
